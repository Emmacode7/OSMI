<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — One Square Meter Initiative</title>
<link rel="icon" href="assets/osmi-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<header class="site-header">
  <div class="nav-inner">
    <div style="display:flex;align-items:center;">
      <a class="brand" href="index.html">
        <img src="assets/osmi-logo.png" alt="One Square Meter Initiative" />
      </a>
      <div class="powered-by">
        <div>
          <div class="pb-label">Powered by</div>
          <div class="pb-brand">
            <img src="assets/leisure-court-logo.png" alt="Leisure Court" />
          </div>
        </div>
      </div>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="buy.html">Buy</a>
      <a href="sell.html">Sell Back</a>
      <a href="about.html">About &amp; Contact</a>
      <a href="login.html" class="auth-logged-out" data-show="inline-block">Log In</a>
      <a href="signup.html" class="auth-logged-out nav-cta" data-show="inline-block">Sign Up</a>
      <div class="nav-account auth-logged-in" id="navAccount" data-show="inline-block">
        <button type="button" class="nav-account-trigger" id="navAccountTrigger">
          <span class="auth-buyer-name">Account</span> <span class="caret">▾</span>
        </button>
        <div class="nav-account-menu" id="navAccountMenu">
          <a href="dashboard.html">My Plots</a>
          <a href="profile.html">Profile</a>
          <a href="#" id="navLogoutBtn">Log Out</a>
        </div>
      </div>
    </nav>
  </div>
</header>

<main class="section-tight">
  <div class="container auth-shell">
    <div class="section-label" style="text-align:center;">Reset your password</div>
    <h2 class="section-title" style="text-align:center;">Forgot your password?</h2>
    <p style="color:var(--ink-dim); font-size:14px; text-align:center; margin-top:-8px;">Enter your email and we'll send you a link to set a new one.</p>

    <div class="panel">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />

      <button class="btn-block" id="requestBtn" type="button">Send Reset Link</button>
      <div class="status" id="statusBox"></div>
    </div>

    <div class="auth-switch"><a href="login.html">Back to log in</a></div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="assets/osmi-logo.png" alt="One Square Meter Initiative" />
      <span>© 2026 One Square Meter Initiative — powered by <span class="font-anton">Leisure Court</span></span>
    </div>
    <div class="footer-links">
      <a href="about.html">About &amp; Contact</a>
    </div>
  </div>
</footer>

<script src="js/site-nav.js"></script>
<script src="js/site-config.js"></script>
<script src="js/site-api.js"></script>
<script src="js/site-auth.js"></script>
<script>
(function(){
  const el = (id) => document.getElementById(id);

  function showStatus(kind, text){
    const box = el('statusBox');
    box.className = 'status show ' + kind;
    box.textContent = text;
  }

  async function doRequest(){
    const email = el('email').value.trim();
    if (!email){
      showStatus('error', 'Enter your email.');
      return;
    }

    el('requestBtn').disabled = true;
    showStatus('pending', 'Sending…');

    try{
      const result = await OsmiApi.requestPasswordReset(email);
      showStatus('ok', result.message || 'If that email has an account, we\u2019ve sent a reset link.');
    } catch (err){
      showStatus('error', 'Could not reach the server. Please try again.');
    }
    el('requestBtn').disabled = false;
  }

  el('requestBtn').addEventListener('click', doRequest);
  el('email').addEventListener('keydown', (e) => { if (e.key === 'Enter') doRequest(); });
})();
</script>
</body>
</html>
