<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — One Square Meter Initiative</title>
<link rel="icon" href="assets/osmi-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<header class="site-header">
  <div class="nav-inner">
    <div style="display:flex;align-items:center;">
      <a class="brand" href="index.html">
        <img src="assets/osmi-logo.png" alt="One Square Meter Initiative" />
      </a>
      <div class="powered-by">
        <div>
          <div class="pb-label">Powered by</div>
          <div class="pb-brand">
            <img src="assets/leisure-court-logo.png" alt="Leisure Court" />
            <span class="pb-name font-anton">LEISURE COURT</span>
          </div>
        </div>
      </div>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="buy.html">Buy</a>
      <a href="sell.html">Sell Back</a>
      <a href="about.html">About &amp; Contact</a>
      <a href="login.html" class="auth-logged-out">Log In</a>
      <a href="signup.html" class="auth-logged-out nav-cta">Sign Up</a>
      <div class="nav-account auth-logged-in" id="navAccount">
        <button type="button" class="nav-account-trigger" id="navAccountTrigger">
          <span class="auth-buyer-name">Account</span> <span class="caret">▾</span>
        </button>
        <div class="nav-account-menu" id="navAccountMenu">
          <a href="dashboard.html">My Plots</a>
          <a href="profile.html">Profile</a>
          <a href="#" id="navLogoutBtn">Log Out</a>
        </div>
      </div>
    </nav>
  </div>
</header>

<main class="section-tight">
  <div class="container auth-shell">
    <div class="section-label" style="text-align:center;">Reset your password</div>
    <h2 class="section-title" style="text-align:center;">Set a new password</h2>

    <div class="panel" id="formPanel">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" placeholder="At least 6 characters" autocomplete="new-password" />

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" placeholder="Re-enter your new password" autocomplete="new-password" />

      <button class="btn-block" id="resetBtn" type="button">Set New Password</button>
      <div class="status" id="statusBox"></div>
    </div>

    <div class="auth-switch"><a href="login.html">Back to log in</a></div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="assets/osmi-logo.png" alt="One Square Meter Initiative" />
      <span>© 2026 One Square Meter Initiative — powered by <span class="font-anton">Leisure Court</span></span>
    </div>
    <div class="footer-links">
      <a href="about.html">About &amp; Contact</a>
    </div>
  </div>
</footer>

<script src="js/site-nav.js"></script>
<script src="js/site-config.js"></script>
<script src="js/site-api.js"></script>
<script src="js/site-auth.js"></script>
<script>
(function(){
  const el = (id) => document.getElementById(id);
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  function showStatus(kind, text){
    const box = el('statusBox');
    box.className = 'status show ' + kind;
    box.textContent = text;
  }

  if (!token){
    el('formPanel').innerHTML = '<div class="status show error">This page needs a reset link — please use the link from your email.</div>';
  }

  async function doReset(){
    const newPassword = el('newPassword').value;
    const confirmPassword = el('confirmPassword').value;

    if (!newPassword || !confirmPassword){
      showStatus('error', 'Fill in both fields.');
      return;
    }
    if (newPassword.length < 6){
      showStatus('error', 'Password must be at least 6 characters.');
      return;
    }
    if (newPassword !== confirmPassword){
      showStatus('error', 'Passwords do not match.');
      return;
    }

    el('resetBtn').disabled = true;
    showStatus('pending', 'Updating your password…');

    try{
      const result = await OsmiApi.resetPassword(token, newPassword);
      if (result.success){
        showStatus('ok', (result.message || 'Password updated.') + ' Redirecting to log in…');
        OsmiAuth.clearSession();
        setTimeout(() => { window.location.href = 'login.html'; }, 1200);
      } else {
        el('resetBtn').disabled = false;
        showStatus('error', result.message || 'Could not reset your password.');
      }
    } catch (err){
      el('resetBtn').disabled = false;
      showStatus('error', 'Could not reach the server. Please try again.');
    }
  }

  const resetBtn = el('resetBtn');
  if (resetBtn){
    resetBtn.addEventListener('click', doReset);
  }
})();
</script>
</body>
</html>
