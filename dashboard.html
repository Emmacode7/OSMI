<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Plots — One Square Meter Initiative</title>
<link rel="icon" href="assets/osmi-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<header class="site-header">
  <div class="nav-inner">
    <div style="display:flex;align-items:center;">
      <a class="brand" href="index.html">
        <img src="assets/osmi-logo.png" alt="One Square Meter Initiative" />
      </a>
      <div class="powered-by">
        <div>
          <div class="pb-label">Powered by</div>
          <div class="pb-brand">
            <img src="assets/leisure-court-logo.png" alt="Leisure Court" />
          </div>
        </div>
      </div>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="buy.html">Buy</a>
      <a href="sell.html">Sell Back</a>
      <a href="about.html">About &amp; Contact</a>
      <a href="login.html" class="auth-logged-out" data-show="inline-block">Log In</a>
      <a href="signup.html" class="auth-logged-out nav-cta" data-show="inline-block">Sign Up</a>
      <div class="nav-account auth-logged-in" id="navAccount" data-show="inline-block">
        <button type="button" class="nav-account-trigger" id="navAccountTrigger">
          <span class="auth-buyer-name">Account</span> <span class="caret">▾</span>
        </button>
        <div class="nav-account-menu" id="navAccountMenu">
          <a href="dashboard.html" class="active">My Plots</a>
          <a href="profile.html">Profile</a>
          <a href="#" id="navLogoutBtn">Log Out</a>
        </div>
      </div>
    </nav>
  </div>
</header>

<main class="section-tight">
  <div class="container" style="max-width:820px;">
    <div class="section-label">Your account</div>
    <h2 class="section-title" id="pageTitle">My Plots</h2>

    <div class="status" id="statusBox"></div>
    <div id="verifyBanner" style="margin-bottom:16px;"></div>
    <div id="summaryRow"></div>
    <div id="plotsGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px; margin-top:8px;"></div>
    <div id="detailSection" style="margin-top:28px;"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="assets/osmi-logo.png" alt="One Square Meter Initiative" />
      <span>© 2026 One Square Meter Initiative — powered by <span class="font-anton">Leisure Court</span></span>
    </div>
    <div class="footer-links">
      <a href="buy.html">Buy More</a>
      <a href="sell.html">Sell Back</a>
    </div>
  </div>
</footer>

<script src="js/site-nav.js"></script>
<script src="js/site-config.js"></script>
<script src="js/site-api.js"></script>
<script src="js/site-auth.js"></script>
<script>
(function(){
  OsmiAuth.requireLogin();
  OsmiAuth.renderVerificationBanner('verifyBanner');

  const el = (id) => document.getElementById(id);

  function showStatus(kind, text){
    const box = el('statusBox');
    box.className = 'status show ' + kind;
    box.textContent = text;
  }

  function formatNaira(n){ return '₦' + Number(n).toLocaleString('en-NG'); }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function formatDate(d){
    try{
      const date = new Date(d);
      if (isNaN(date.getTime())) return String(d);
      return date.toLocaleDateString('en-NG', { year:'numeric', month:'short', day:'numeric' });
    }catch(e){ return String(d); }
  }

  async function load(){
    showStatus('pending', 'Loading your plots…');
    try{
      const token = OsmiAuth.getToken();
      const result = await OsmiApi.getMyPlots(token);
      if (!result.success){
        showStatus('error', result.message || 'Could not load your plots.');
        if (result.message && result.message.toLowerCase().includes('session')){
          OsmiAuth.clearSession();
          setTimeout(() => { window.location.href = 'login.html'; }, 1200);
        }
        return;
      }
      el('statusBox').className = 'status';
      const firstName = (result.buyer && result.buyer.name) ? result.buyer.name.split(' ')[0] : '';
      el('pageTitle').textContent = firstName ? ('Welcome back, ' + firstName) : 'My Plots';
      renderPlots(result.plots || []);
    } catch (err){
      showStatus('error', 'Could not reach the server. Please try again.');
    }
  }

  function renderPlots(plots){
    if (plots.length === 0){
      el('summaryRow').innerHTML = '';
      el('plotsGrid').innerHTML =
        '<div class="panel" style="grid-column:1/-1; text-align:center;">' +
          '<p style="color:var(--ink-dim); margin-bottom:16px;">You don\u2019t own any square meters yet.</p>' +
          '<a href="buy.html" class="btn btn-primary">Buy your first sqm</a>' +
        '</div>';
      return;
    }

    const totalSqm = plots.reduce((s,p) => s + p.mySqm, 0);
    const totalPlots = plots.length;
    el('summaryRow').innerHTML =
      '<div class="stats-bar panel" style="margin-bottom:18px;">' +
        '<div class="stat"><div class="num">' + totalSqm + '</div><div class="lbl">Total sqm owned</div></div>' +
        '<div class="stat"><div class="num">' + totalPlots + '</div><div class="lbl">Plot' + (totalPlots === 1 ? '' : 's') + '</div></div>' +
      '</div>';

    el('plotsGrid').innerHTML = plots.map((p, i) =>
      '<div class="panel myplot-card" data-idx="' + i + '">' +
        '<div class="mp-head">' +
          '<span class="mp-name">' + escapeHtml(p.plotName) + '</span>' +
          '<span class="mp-id">' + escapeHtml(String(p.plotId)) + '</span>' +
        '</div>' +
        '<div style="font-family:\'IBM Plex Mono\', monospace; font-size:13px; color:var(--ink-dim);">' + p.mySqm + ' / ' + p.totalSqm + ' sqm \u00b7 ' + p.progressPercent.toFixed(1) + '%</div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + Math.min(p.progressPercent,100).toFixed(1) + '%"></div></div>' +
      '</div>'
    ).join('');

    document.querySelectorAll('.myplot-card').forEach(card => {
      card.addEventListener('click', () => {
        const idx = Number(card.getAttribute('data-idx'));
        renderDetail(plots[idx]);
        document.getElementById('detailSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  function renderDetail(plot){
    const cols = Math.max(1, Math.round(Math.sqrt(plot.totalSqm)));
    const boxes = new Array(plot.totalSqm).fill(null);
    let cursor = 0;
    plot.transactions.forEach(t => {
      for (let i = 0; i < t.sqmCount && cursor < plot.totalSqm; i++, cursor++) boxes[cursor] = t;
    });

    let html =
      '<div class="panel">' +
        '<div class="plot-name-line">' +
          '<div><h3>' + escapeHtml(plot.plotName) + '</h3><span class="id">' + escapeHtml(String(plot.plotId)) + '</span></div>' +
          '<span class="price mono">' + formatNaira(plot.currentPricePerSqm) + '/sqm current rate</span>' +
        '</div>' +
        '<div class="hint">Colored boxes are your own purchases on this plot. Grey boxes belong to other buyers — for their privacy, only your own allocation details are shown here.</div>' +
      '</div>' +
      '<div class="panel"><div class="grid-scroll"><div class="sqm-grid" id="detailGrid" style="grid-template-columns:repeat(' + cols + ', 1fr)"></div></div></div>' +
      '<div class="panel"><div id="detailInspector"><div class="inspector-empty">Click any of your colored boxes to see the price and date for that purchase.</div></div></div>';

    el('detailSection').innerHTML = html;

    const PALETTE = ['#1e8449', '#e8b923', '#2f7a94'];
    const grid = el('detailGrid');
    boxes.forEach((owner, idx) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (owner){
        const txIdx = plot.transactions.indexOf(owner);
        cell.style.background = PALETTE[txIdx % PALETTE.length];
      }
      cell.addEventListener('click', () => {
        document.querySelectorAll('#detailGrid .cell').forEach((c, i) => c.classList.toggle('selected', i === idx));
        renderDetailInspector(owner, idx);
      });
      grid.appendChild(cell);
    });
  }

  function renderDetailInspector(owner, idx){
    const box = el('detailInspector');
    if (!owner){
      box.innerHTML = '<div class="inspector-row"><span class="k">Box</span><span class="v">#' + (idx+1) + '</span></div>' +
        '<div class="inspector-row"><span class="k">Status</span><span class="v">Not part of your allocation</span></div>';
      return;
    }
    box.innerHTML =
      '<div class="inspector-row"><span class="k">Box</span><span class="v">#' + (idx+1) + '</span></div>' +
      '<div class="inspector-row"><span class="k">Allocation ID</span><span class="v">' + escapeHtml(String(owner.id)) + '</span></div>' +
      '<div class="inspector-row"><span class="k">Sqm in this purchase</span><span class="v">' + owner.sqmCount + '</span></div>' +
      '<div class="inspector-row"><span class="k">Price paid per sqm</span><span class="v">' + formatNaira(owner.pricePerSqm) + '</span></div>' +
      '<div class="inspector-row"><span class="k">Total paid for this portion</span><span class="v">' + formatNaira(owner.totalPaid) + '</span></div>' +
      '<div class="inspector-row"><span class="k">Date</span><span class="v">' + escapeHtml(formatDate(owner.date)) + '</span></div>';
  }

  load();
})();
</script>
</body>
</html>
